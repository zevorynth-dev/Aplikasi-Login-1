name: JSDoc build on GitHub repo

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: 02-solution-study-case

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build
        run: |
          npm install --no-save jsdoc minami
          npx jsdoc ./assets -r \
            -c ./assets/jsdoc/conf.json \
            -t ./node_modules/minami \
            -d ./out \
            -R README.md

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
